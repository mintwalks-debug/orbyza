<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Orbyza Logo">
  <title>Orbyza</title>
  <defs>
    <style>
      .logo-text {
        font-family: 'Arial Black', 'Arial Bold', sans-serif;
        font-weight: 900;
        font-size: 84px;
        fill: #1a1a2e;
        letter-spacing: -2px;
      }
    </style>
    <!-- Teal gradient for aperture rings -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a9db5"/>
      <stop offset="100%" stop-color="#1a7a93"/>
    </linearGradient>
    <!-- Inner aperture shading -->
    <radialGradient id="apertureGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ab5cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a7a93" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Drop shadow for text -->
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- ======================== -->
  <!--   APERTURE "O" ICON     -->
  <!-- ======================== -->
  <!-- Outer ring 1 -->
  <circle cx="55" cy="62" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="2.2" opacity="0.9"/>
  <!-- Outer ring 2 -->
  <circle cx="55" cy="62" r="43" fill="none" stroke="#2a9db5" stroke-width="1.4" opacity="0.6"/>
  <!-- Inner background circle -->
  <circle cx="55" cy="62" r="37" fill="url(#apertureGrad)" opacity="0.15"/>

  <!-- Aperture blades — 6 curved blade shapes rotated around center -->
  <g transform="translate(55,62)" fill="#2a9db5" opacity="0.85">
    <!-- Blade 1 -->
    <path d="M0,-22 Q8,-10 4,0 Q-2,-4 0,-22Z" transform="rotate(0)"/>
    <!-- Blade 2 -->
    <path d="M0,-22 Q8,-10 4,0 Q-2,-4 0,-22Z" transform="rotate(60)"/>
    <!-- Blade 3 -->
    <path d="M0,-22 Q8,-10 4,0 Q-2,-4 0,-22Z" transform="rotate(120)"/>
    <!-- Blade 4 -->
    <path d="M0,-22 Q8,-10 4,0 Q-2,-4 0,-22Z" transform="rotate(180)"/>
    <!-- Blade 5 -->
    <path d="M0,-22 Q8,-10 4,0 Q-2,-4 0,-22Z" transform="rotate(240)"/>
    <!-- Blade 6 -->
    <path d="M0,-22 Q8,-10 4,0 Q-2,-4 0,-22Z" transform="rotate(300)"/>
  </g>

  <!-- Center aperture circle -->
  <circle cx="55" cy="62" r="8" fill="#1a7a93" opacity="0.7"/>
  <circle cx="55" cy="62" r="4" fill="#2a9db5" opacity="0.9"/>

  <!-- Small decorative tick marks on outer ring -->
  <g stroke="#2a9db5" stroke-width="1" opacity="0.5">
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(0,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(30,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(60,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(90,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(120,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(150,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(180,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(210,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(240,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(270,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(300,55,62)"/>
    <line x1="55" y1="10" x2="55" y2="16" transform="rotate(330,55,62)"/>
  </g>

  <!-- ======================== -->
  <!--   "RBYZA" TEXT          -->
  <!-- ======================== -->
  <text x="108" y="100" filter="url(#textShadow)"
    font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
    font-weight="900"
    font-size="80"
    fill="#1a1a2e"
    letter-spacing="-1">RBYZA</text>

  <!-- ======================== -->
  <!--   PIXEL ROCKET ABOVE A  -->
  <!-- ======================== -->
  <!--
    The rocket is above and to-the-right of the "A".
    "RBYZA" starts at x=108, each char ~47px wide, A is the 5th char.
    A starts around x=108+4*47=296, rocket tip at ~460,10 area
    We'll place scattered square pixel fragments flying upper-right
  -->
  <g opacity="0.9">
    <!-- Main rocket body (solid blue triangular shards) -->
    <!-- Core shard cluster -->
    <rect x="449" y="38" width="10" height="10" fill="#2a9db5" transform="rotate(-35,454,43)"/>
    <rect x="462" y="25" width="8" height="8" fill="#3ab5cc" transform="rotate(-25,466,29)"/>
    <rect x="456" y="14" width="7" height="7" fill="#1a7a93" transform="rotate(-40,459,17)"/>
    <rect x="469" y="16" width="6" height="6" fill="#5ac8dc" transform="rotate(-15,472,19)"/>
    <rect x="474" y="8" width="5" height="5" fill="#2a9db5" transform="rotate(-50,476,10)"/>

    <!-- Mid trail -->
    <rect x="440" y="44" width="9" height="9" fill="#1a7a93" transform="rotate(-30,444,48)"/>
    <rect x="432" y="52" width="7" height="7" fill="#2a9db5" transform="rotate(-20,435,55)"/>
    <rect x="424" y="58" width="6" height="6" fill="#3ab5cc" transform="rotate(-45,427,61)"/>

    <!-- Scattered small particles (upper right) -->
    <rect x="480" y="18" width="4" height="4" fill="#5ac8dc" transform="rotate(-10,482,20)" opacity="0.7"/>
    <rect x="487" y="10" width="3" height="3" fill="#2a9db5" transform="rotate(-25,488,11)" opacity="0.6"/>
    <rect x="477" y="30" width="3" height="3" fill="#3ab5cc" transform="rotate(-35,478,31)" opacity="0.65"/>
    <rect x="492" y="22" width="4" height="4" fill="#1a7a93" transform="rotate(-15,494,24)" opacity="0.55"/>
    <rect x="484" y="3" width="3" height="3" fill="#5ac8dc" transform="rotate(-45,485,4)" opacity="0.5"/>

    <!-- Lower trail (connecting to A) -->
    <rect x="416" y="65" width="5" height="5" fill="#2a9db5" transform="rotate(-20,418,67)" opacity="0.7"/>
    <rect x="410" y="70" width="4" height="4" fill="#1a7a93" transform="rotate(-30,412,72)" opacity="0.5"/>
  </g>
</svg>
